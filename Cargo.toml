[package]
name = "tim-ws"
version = "0.1.0"
edition = "2021"
authors = ["Finn Malte Hinrichsen"]
repository = "https://github.com/fmhc/tim-ws"
description = "Streams SICK TiM LiDAR scans (CoLa A over TCP) to WebSocket clients, with UTC timestamps and clock status"
license = "MIT OR Apache-2.0"
keywords = ["lidar", "sick", "websocket", "tim551", "cola"]
categories = ["science::robotics", "network-programming"]
readme = "README.md"
exclude = ["/fuzz", "/.github"]

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "signal", "io-util", "fs"] }
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util"] }
