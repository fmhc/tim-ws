<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tim-ws viewer</title>
<style>
  :root { --bg: #0e1116; --fg: #d7dde5; --dim: #5b6573; --grid: #1f2630; --pt: #59d1a0; --warn: #f0b44c; --bad: #ef6b6b; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, monospace; }
  header { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--grid); }
  header b { font-weight: 600; }
  #state.streaming { color: var(--pt); } #state.disconnected, #state.connecting, #state.closed { color: var(--bad); }
  .stale { color: var(--warn); }
  canvas { display: block; width: 100%; height: calc(100% - 38px); }
</style>
</head>
<body>
<header>
  <span>state <b id="state">-</b></span>
  <span>rate <b id="hz">-</b></span>
  <span>age <b id="age">-</b></span>
  <span>gaps <b id="gaps">0</b></span>
  <span>clock <b id="clock">-</b></span>
  <span>scale <b id="scale">-</b></span>
  <span id="device"></span>
</header>
<canvas id="c"></canvas>
<script>
// Usage: open this file and pass ?ws=ws://host:9002/ (default ws://127.0.0.1:9002/).
// Device convention: 90 deg is straight ahead and is drawn upwards. Mouse wheel zooms.
const url = new URLSearchParams(location.search).get("ws") || "ws://127.0.0.1:9002/";
const $ = id => document.getElementById(id);
const canvas = $("c"), ctx = canvas.getContext("2d");
let scan = null, maxRange = 4, times = [], lastStatus = null;

function resize() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
}
addEventListener("resize", resize); resize();
canvas.addEventListener("wheel", e => { maxRange = Math.min(30, Math.max(0.25, maxRange * (e.deltaY > 0 ? 1.15 : 1 / 1.15))); e.preventDefault(); }, { passive: false });

function draw() {
  const w = canvas.width, h = canvas.height, cx = w / 2, cy = h * 0.6;
  const px = Math.min(w / 2, h * 0.6) / maxRange;
  ctx.fillStyle = "#0e1116"; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "#1f2630"; ctx.fillStyle = "#5b6573"; ctx.lineWidth = devicePixelRatio;
  ctx.font = `${11 * devicePixelRatio}px ui-monospace, monospace`;
  const ring = maxRange > 8 ? 2 : maxRange > 2 ? 1 : 0.25;
  for (let r = ring; r <= maxRange; r += ring) {
    ctx.beginPath(); ctx.arc(cx, cy, r * px, 0, 2 * Math.PI); ctx.stroke();
    ctx.fillText(`${r} m`, cx + 4, cy - r * px - 4);
  }
  if (scan) {
    const a = scan.angle;
    // Field of view edges.
    for (const deg of [a.start, a.start + (a.count - 1) * a.step]) {
      const t = deg * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(t) * maxRange * px, cy - Math.sin(t) * maxRange * px); ctx.stroke();
    }
    ctx.fillStyle = "#59d1a0";
    const s = 2.5 * devicePixelRatio;
    scan.range_m.forEach((r, i) => {
      if (r === null) return;
      const t = (a.start + i * a.step) * Math.PI / 180;
      ctx.fillRect(cx + Math.cos(t) * r * px - s / 2, cy - Math.sin(t) * r * px - s / 2, s, s);
    });
  }
  ctx.fillStyle = "#d7dde5"; ctx.beginPath(); ctx.arc(cx, cy, 4 * devicePixelRatio, 0, 2 * Math.PI); ctx.fill();
  $("scale").textContent = `${maxRange.toFixed(2)} m`;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function connect() {
  const ws = new WebSocket(url);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "scan") {
      scan = m;
      times.push(m.host_recv_utc_us); if (times.length > 31) times.shift();
      if (times.length > 1) $("hz").textContent = ((times.length - 1) * 1e6 / (times.at(-1) - times[0])).toFixed(2) + " Hz";
    } else if (m.type === "status") {
      lastStatus = m;
      $("state").textContent = m.state; $("state").className = m.state;
      $("gaps").textContent = m.counter_gaps;
      $("clock").textContent = m.host_clock ? (m.host_clock.synced ? "ntp synced" : "NOT synced") : "unknown";
      $("clock").className = m.host_clock && m.host_clock.synced ? "" : "stale";
      $("device").textContent = [m.identity.DItype, m.identity.DeviceIdent].filter(Boolean).join(" · ");
    }
  };
  ws.onclose = () => { $("state").textContent = "closed"; $("state").className = "closed"; scan = null; setTimeout(connect, 1000); };
}
connect();

// Data age from the browser clock; stale data must not look current.
setInterval(() => {
  if (!scan) { $("age").textContent = "-"; return; }
  const age = Date.now() - scan.host_recv_utc_us / 1000;
  $("age").textContent = `${Math.max(0, age).toFixed(0)} ms`;
  $("age").className = age > 500 ? "stale" : "";
}, 200);
</script>
</body>
</html>
